name: Test podman login with custom auth file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install podman
        run: |
          which podman || (apt-get update -qq && apt-get install -y -qq podman)

      - name: Create auth file directory
        run: mkdir -p /tmp/podman-auth

      - id: action
        uses: .
        with:
          registry: docker.io
          username: testuser
          password: testpassword
          auth_file_path: /tmp/podman-auth/auth.json
        continue-on-error: true

      - name: Assert action ran with custom auth file path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with an auth error (not a missing input error)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and attempted login with custom auth file"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
