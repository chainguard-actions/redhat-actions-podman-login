name: Test podman login with logout disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install podman
        run: |
          which podman || (apt-get update -qq && apt-get install -y -qq podman)

      - id: action
        uses: .
        with:
          registry: docker.io
          username: testuser
          password: testpassword
          logout: 'false'
        continue-on-error: true

      - name: Assert action ran with logout disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with an auth error (not a missing input error)
          # With logout: false, the post step should not log out
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with logout disabled"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
