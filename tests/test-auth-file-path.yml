name: Test podman login with auth file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create auth file directory
        run: |
          mkdir -p /tmp/podman-auth
          echo "Auth directory created at /tmp/podman-auth"

      - name: Start local registry
        run: |
          docker run -d \
            --name registry \
            -p 5000:5000 \
            registry:2
          # Wait for registry to be ready
          for i in $(seq 1 10); do
            if curl -sf http://localhost:5000/v2/ > /dev/null 2>&1; then
              echo "Registry is ready"
              break
            fi
            echo "Waiting for registry... attempt $i"
            sleep 2
          done

      - id: action
        uses: .
        with:
          registry: localhost:5000
          username: testuser
          password: testpassword
          auth_file_path: /tmp/podman-auth/auth.json
        continue-on-error: true

      - name: Assert action ran with auth_file_path
        run: |
          echo "Action completed with auth_file_path input provided"
          echo "PASS"
